# Mantem o servico gratuito do Render acordado durante o horario escolar (fuso de Brasilia).
# O plano free hiberna apos inatividade; este cron bate no /health a cada 10 minutos.
# Configuracao: criar a variavel de repositorio POLAR_HEALTH_URL em
# Settings > Secrets and variables > Actions > Variables
# com o valor https://SEU-SERVICO.onrender.com/health
name: Keepalive

on:
  schedule:
    # A cada 10 minutos, das 09h as 23h UTC (06h as 20h em Brasilia), dias uteis.
    - cron: "*/10 9-23 * * 1-5"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          HEALTH_URL: ${{ vars.POLAR_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "POLAR_HEALTH_URL nao configurada; nada a fazer."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 "$HEALTH_URL" && echo "OK"
