# Blueprint do Render (https://render.com) - plano gratuito, 1 servico.
# O banco MySQL fica fora do Render (TiDB Serverless ou Aiven, tambem gratuitos).
# Passo a passo completo: docs/deploy/render.md
services:
  - type: web
    name: polar
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PROVIDER
        value: mysql
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false # definir no painel: mysql://usuario:senha@host:porta/banco
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        sync: false # definir com a URL publica do proprio servico, ex: https://polar.onrender.com
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false # senha forte; obrigatorio trocar no primeiro login
